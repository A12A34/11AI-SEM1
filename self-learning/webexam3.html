<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Exam 3</title>
    <style>
        *{
            text-align: center;
            box-sizing: border-box;
            align-items: center;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-flow: column wrap;
            height: 100vh;
        }
        .container{
            width: 100%;
            height: max-content;
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }
        .card{
            height: auto;
            max-width: 33.33%;
            background-color: white;
            border: 0.5px solid black;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-size: 1.2em;
            color: #333;
            flex-flow: column nowrap;
        }
        .card img{
            width: 100%;
            height: auto;
            display: block;
        }
        .card button{
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background-color: gray;
            color: white;
            cursor: pointer;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            text-align: center;
        }
        .card h2{
            margin: 10px 0 5px 0;
            padding: 0 10px;
            text-align: left;
        }
        .card p{
            font-size: 1em;
            color: #666;
            margin: 0 10px 10px 10px;
            text-align: left;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="https://via.placeholder.com/300x150" alt="Placeholder Image 1">
            <h2>Card Title 1</h2>
            <p>This is a description for card 1.</p>
            <button>Click Me</button>
        </div>
        <div class="card">

        </div>

        </div>

</html>
