<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Web Exam 6</title>
        <link rel="stylesheet" href="/self-learning/webexam6/webexam6.css">
    </head>
    <body>
        <div class="calc" role="application" aria-label="Simple calculator">
            <div class="display" id="display" aria-live="polite">0</div>
            <button class="btnClear">C</button>
            <button class="btnDiv btnOperator">/</button>
            <button class="btnMul btnOperator">*</button>
            <button class="btnSub btnOperator">-</button>
            <button class="btn7 btnNumber">7</button>
            <button class="btn8 btnNumber">8</button>
            <button class="btn9 btnNumber">9</button>
            <button class="btnAdd btnOperator">+</button>
            <button class="btn4 btnNumber">4</button>
            <button class="btn5 btnNumber">5</button>
            <button class="btn6 btnNumber">6</button>
            <button class="btnEql btnEqual">=</button>
            <button class="btn1 btnNumber">1</button>
            <button class="btn2 btnNumber">2</button>
            <button class="btn3 btnNumber">3</button>
            <button class="btn0 btnNumber">0</button>
            <button class="btnDot btnDecimal">.</button>
        </div>

        <script src="/self-learning/webexam6/webexam6.js" defer></script>
    </body>
</html>
